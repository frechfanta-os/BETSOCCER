name: BETSOCCER - Build & Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    name: Build & Verify Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract Pubspec Version & Build Number
        id: version_extract
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d '+' -f 1)
          VERSION_CODE=$(echo "$VERSION_LINE" | cut -d '+' -f 2)
          echo "PUBSPEC_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "PUBSPEC_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Extracted Version: $VERSION_NAME+$VERSION_CODE"

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ env.PUBSPEC_VERSION_NAME }}" \
            --build-number="${{ env.PUBSPEC_VERSION_CODE }}" \
            --verbose

      - name: Validate APK Internal Metadata & Package ID
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT_BIN=$(find "$SDK_DIR/build-tools" -name aapt 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$AAPT_BIN" ]; then
            AAPT_BIN="aapt"
          fi
          echo "Using aapt binary: $AAPT_BIN"
          
          PACKAGE_NAME=$($AAPT_BIN dump badging "$APK_PATH" | grep "package: name=" | sed -E "s/.*package: name='([^']+)'.*/\1/")
          echo "Detected APK Package Name: $PACKAGE_NAME"
          
          if [ "$PACKAGE_NAME" != "com.ghdinteractivestudio.betsoccer" ]; then
            echo "ERROR: Package name mismatch! Expected 'com.ghdinteractivestudio.betsoccer', got '$PACKAGE_NAME'"
            exit 1
          fi
          echo "Package name verification PASSED."

      - name: Prepare Release Artifacts & SHA-256 Checksums
        run: |
          mkdir -p release-artifacts
          SRC_APK="build/app/outputs/flutter-apk/app-release.apk"
          NAMED_APK="release-artifacts/BETSOCCER-v${{ env.PUBSPEC_VERSION_NAME }}.apk"
          STANDARD_APK="release-artifacts/app-release.apk"
          
          cp "$SRC_APK" "$STANDARD_APK"
          cp "$SRC_APK" "$NAMED_APK"
          
          cd release-artifacts
          sha256sum "app-release.apk" "BETSOCCER-v${{ env.PUBSPEC_VERSION_NAME }}.apk" > app-release.apk.sha256
          PRIMARY_SHA256=$(sha256sum "app-release.apk" | awk '{print $1}')
          echo "PRIMARY_SHA256=$PRIMARY_SHA256" >> $GITHUB_ENV
          cd ..

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BETSOCCER-Android-APK
          path: |
            release-artifacts/app-release.apk
            release-artifacts/BETSOCCER-v${{ env.PUBSPEC_VERSION_NAME }}.apk
            release-artifacts/app-release.apk.sha256
          if-no-files-found: error

      - name: Generate Release Notes
        run: |
          cat << 'EOF' > RELEASE_NOTES.md
          ## BETSOCCER v${{ env.PUBSPEC_VERSION_NAME }} (Build ${{ env.PUBSPEC_VERSION_CODE }})

          Première release officielle de **BETSOCCER** — Plateforme d'analyse et de suivi multisport avec IA.

          ### Fonctionnalités Clés
          - **Matchs en Direct & Prochaines Rencontres** : Suivi des scores en direct et calendrier des fixtures avec filtrage strict par statut (`live` et `upcoming`).
          - **Connecteurs d'API Réelles** :
            - **OpenLigaDB** : Intégration en temps réel des matchs et résultats (Bundesliga, championnats européens).
            - **TheSportsDB** : Calendrier des prochaines fixtures (Premier League, La Liga, Serie A, etc.).
          - **Stockage Local SQLite Robuste** : Schéma relationnel complet (10 tables) assurant la persistance et le fonctionnement hors-ligne.
          - **Résultats Historiques & Statistiques** : Base de données de plus de 2 400 matchs historiques pour l'analyse prédictive et les métriques de performance.
          - **Architecture & Fiabilité** : Synchronisation réseau avec résilience, cache HTTP et isolation des erreurs.
          - **Politique Éthique & Données** : Respect strict du *zero-odds policy*. Le connecteur MelBet est audité et désactivé par politique (`DISABLED_BY_POLICY` / `RESTRICTED_BY_ROBOTS_TXT`).

          ### Intégrité des Fichiers & Sécurité
          - **Application ID** : `com.ghdinteractivestudio.betsoccer`
          - **SHA-256** : `${{ env.PRIMARY_SHA256 }}`

          ### Instructions d'Installation
          1. Télécharger `BETSOCCER-v${{ env.PUBSPEC_VERSION_NAME }}.apk` ou `app-release.apk`.
          2. Autoriser l'installation d'applications issues de sources inconnues si demandé sur votre appareil Android.
          3. Vérifier l'empreinte SHA-256 avec `sha256sum app-release.apk` avant installation.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: BETSOCCER v${{ env.PUBSPEC_VERSION_NAME }}
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/app-release.apk
            release-artifacts/BETSOCCER-v${{ env.PUBSPEC_VERSION_NAME }}.apk
            release-artifacts/app-release.apk.sha256
