name: Build Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build BETSOCCER Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Ensure Google Services Configuration
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/google-services.json" ]; then
            echo "Generating android/app/google-services.json for release build..."
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "561415224411",
              "firebase_url": "https://betsoccer-60834-default-rtdb.firebaseio.com",
              "project_id": "betsoccer-60834",
              "storage_bucket": "betsoccer-60834.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:561415224411:android:com_ghdinteractivestudio_betsoccer",
                  "android_client_info": {
                    "package_name": "com.ghdinteractivestudio.betsoccer"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "BND3aJqIS2RcH_um_BUe-KHCCpfEzdJCanC6X19KymUbXhuzWkcD0b7zjVJXc0d0SXzrQm2GnYzHfwdmEdu8uJA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Release Keystore
        run: |
          if [ -f "android/app/betsoccer.keystore" ]; then
            echo "✓ Official BETSOCCER permanent release keystore is present."
            ls -l android/app/betsoccer.keystore
          else
            echo "ERROR: android/app/betsoccer.keystore is missing!"
            exit 1
          fi

      - name: Verify Package & Version Configuration
        run: |
          echo "Verifying package name..."
          grep -q 'namespace = "com.ghdinteractivestudio.betsoccer"' android/app/build.gradle.kts || { echo "ERROR: Invalid namespace in build.gradle.kts!"; exit 1; }
          grep -q 'applicationId = "com.ghdinteractivestudio.betsoccer"' android/app/build.gradle.kts || { echo "ERROR: Invalid applicationId in build.gradle.kts!"; exit 1; }
          
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          PUBSPEC_VERSION_NAME=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f1)
          PUBSPEC_VERSION_CODE=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f2)
          echo "PUBSPEC_VERSION=$PUBSPEC_VERSION" >> $GITHUB_ENV
          echo "PUBSPEC_VERSION_NAME=$PUBSPEC_VERSION_NAME" >> $GITHUB_ENV
          echo "PUBSPEC_VERSION_CODE=$PUBSPEC_VERSION_CODE" >> $GITHUB_ENV
          
          echo "✓ Package name (com.ghdinteractivestudio.betsoccer) verified."
          echo "✓ Version detected: $PUBSPEC_VERSION_NAME (build $PUBSPEC_VERSION_CODE)"
          
          if ! [[ "$PUBSPEC_VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$PUBSPEC_VERSION_CODE" -lt 1 ]; then
            echo "ERROR: versionCode '$PUBSPEC_VERSION_CODE' is invalid!"
            exit 1
          fi

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ env.PUBSPEC_VERSION_NAME }}" \
            --build-number="${{ env.PUBSPEC_VERSION_CODE }}"

      - name: Verify Built APK & Signature
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is missing or empty!"
            exit 1
          fi
          
          ls -la "$APK_PATH"
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          echo "APK_SHA256=$APK_SHA256" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          
          echo "Verifying APK package metadata with aapt..."
          AAPT_BIN=$(which aapt 2>/dev/null || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt 2>/dev/null | sort -V | tail -n 1 || echo "")
          if [ -n "$AAPT_BIN" ] && [ -x "$AAPT_BIN" ]; then
            echo "Using aapt at: $AAPT_BIN"
            "$AAPT_BIN" dump badging "$APK_PATH" | grep -E "package: name=|versionCode=|versionName="
          else
            echo "aapt not found, skipping badging verification."
          fi
          
          echo "Verifying APK signature..."
          APK_FINGERPRINT=$(keytool -printcert -jarfile "$APK_PATH" 2>/dev/null | grep "SHA1:" | awk '{print $2}' || echo "")
          KEYSTORE_FINGERPRINT=$(keytool -list -v -keystore android/app/betsoccer.keystore -storepass betsoccer2026 -alias betsoccer 2>/dev/null | grep "SHA1:" | awk '{print $2}' || echo "")
          
          echo "APK Signature  SHA1: $APK_FINGERPRINT"
          echo "Keystore       SHA1: $KEYSTORE_FINGERPRINT"
          
          if [ -n "$APK_FINGERPRINT" ] && [ -n "$KEYSTORE_FINGERPRINT" ]; then
            if [ "$APK_FINGERPRINT" = "$KEYSTORE_FINGERPRINT" ]; then
              echo "✓ APK signature matches the official BETSOCCER keystore."
            else
              echo "ERROR: APK signature DOES NOT match the official keystore!"
              echo "  APK:      $APK_FINGERPRINT"
              echo "  Keystore: $KEYSTORE_FINGERPRINT"
              exit 1
            fi
          fi
          
          echo "=========================================="
          echo "✓ RELEASE APK BUILT & SIGNED SUCCESSFULLY"
          echo "File: $APK_PATH"
          echo "Version: $PUBSPEC_VERSION_NAME (build $PUBSPEC_VERSION_CODE)"
          echo "Size: $APK_SIZE"
          echo "SHA-256: $APK_SHA256"
          echo "=========================================="
          
          cp "$APK_PATH" "build/app/outputs/flutter-apk/BETSOCCER-v${PUBSPEC_VERSION_NAME}.apk"
          
          echo "$APK_SHA256  app-release.apk" > build/app/outputs/flutter-apk/app-release.apk.sha256
          echo "$APK_SHA256  BETSOCCER-v${PUBSPEC_VERSION_NAME}.apk" >> build/app/outputs/flutter-apk/app-release.apk.sha256
          
          cat << EOF > RELEASE_NOTES_v${PUBSPEC_VERSION_NAME}.md
          ## BETSOCCER v${PUBSPEC_VERSION_NAME} (Build ${PUBSPEC_VERSION_CODE})

          Release officielle de **BETSOCCER** — Plateforme multisport d'analyses et de statistiques IA.

          ### Fonctionnalités
          - **Matchs en Direct & Prochaines Rencontres** : Suivi des scores en direct et calendrier des fixtures avec filtrage strict par statut (\`live\` et \`upcoming\`).
          - **Connecteurs d'API Réelles** :
            - **OpenLigaDB** : Intégration en temps réel des matchs et résultats (Bundesliga, championnats européens).
            - **TheSportsDB** : Calendrier des prochaines fixtures (Premier League, La Liga, Serie A, etc.).
          - **Stockage Local SQLite Robuste** : Schéma relationnel complet (10 tables) assurant la persistance et le fonctionnement hors-ligne.
          - **Résultats Historiques & Statistiques** : Base de données de plus de 2 400 matchs historiques pour l'analyse prédictive et les métriques de performance.
          - **Architecture & Fiabilité** : Synchronisation réseau avec résilience, cache HTTP et isolation des erreurs.
          - **Politique Éthique & Données** : Respect strict du *zero-odds policy*. Le connecteur MelBet est audité et désactivé par politique (\`DISABLED_BY_POLICY\` / \`RESTRICTED_BY_ROBOTS_TXT\`).

          ### Intégrité des Artefacts
          - **Package ID** : \`com.ghdinteractivestudio.betsoccer\`
          - **SHA-256** : \`${APK_SHA256}\`
          - **Taille** : \`${APK_SIZE}\`

          ### Instructions d'Installation
          1. Télécharger \`BETSOCCER-v${PUBSPEC_VERSION_NAME}.apk\` ou \`app-release.apk\`.
          2. Autoriser l'installation d'applications de sources inconnues si nécessaire sur votre appareil Android.
          3. Vérifier l'intégrité du fichier téléchargé avec la somme de contrôle SHA-256.
          EOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betsoccer-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/BETSOCCER-v${{ env.PUBSPEC_VERSION_NAME }}.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/BETSOCCER-v${{ env.PUBSPEC_VERSION_NAME }}.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          name: BETSOCCER ${{ github.ref_name }}
          body_path: RELEASE_NOTES_v${{ env.PUBSPEC_VERSION_NAME }}.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
